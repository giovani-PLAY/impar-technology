name: Conferir fotos e navegação
on:
  push:
    branches: [qa/conferir-fotos-mobile]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Testar página em oito larguras
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund --ignore-scripts playwright-core@1.55.0
          python3 -m http.server 8744 > /tmp/impar-http.log 2>&1 &
          export CHROME_PATH="$(which google-chrome)" NODE_PATH="$RUNNER_TEMP/browser/node_modules"
          node <<'JS'
          const { chromium } = require('playwright-core');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({executablePath: process.env.CHROME_PATH, args:['--no-sandbox']});
            try {
              for (const width of [320,360,390,430,768,900,1024,1440]) {
                const p = await browser.newPage({viewport:{width,height:844},reducedMotion:'reduce'});
                await p.goto('http://localhost:8744/index.html');
                const menu = p.locator('.menu-toggle');
                if(await menu.isVisible()) {
                  await menu.click(); await p.keyboard.press('Escape');
                  assert.equal(await menu.getAttribute('aria-expanded'),'false');
                  await menu.click(); await p.locator('nav a[href="#contato"]').click();
                  assert(p.url().endsWith('#contato'));
                }
                for(const el of await p.locator('img').all()) {
                  await el.scrollIntoViewIfNeeded(); await el.evaluate(i => i.decode());
                }
                assert.equal(await p.locator('.preview-link').count(),5);
                assert.equal(await p.locator('.editorial-photo').count(),4);
                const overflow = await p.evaluate(() => document.documentElement.scrollWidth > innerWidth ? [...document.querySelectorAll('body *')].filter(e=>e.getBoundingClientRect().right>innerWidth+1).map(e=>e.className) : []);
                assert.deepEqual(overflow,[],String(width)+' '+overflow.join(','));
                console.log('PASS',width); await p.close();
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
